name: Rig Controls and Viseme Utility Tests
on:
  push:
    paths:
      - "runtime/story_scene.py"
      - "runtime/align_visemes.py"
      - "tests/test_align_visemes.py"
      - "tests/blender_rig_controls_smoke.py"
      - ".github/workflows/rig-controls-tests.yml"
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile runtime
        run: python3 -m py_compile runtime/story_scene.py runtime/align_visemes.py
      - name: Test viseme cue conversion
        run: python3 -m unittest tests.test_align_visemes
      - name: Install Blender for rig integration test
        run: |
          bash scripts/install_blender.sh
      - name: Test Blender IK, locomotion and finger controls
        run: blender --background --factory-startup --python-exit-code 1 --python tests/blender_rig_controls_smoke.py
