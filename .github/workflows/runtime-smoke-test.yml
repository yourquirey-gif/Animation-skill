name: Blender Python Runtime Smoke Test

on:
  push:
    paths:
      - "runtime/**"
      - "templates/**"
      - "tests/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/runtime-smoke-test.yml"
  workflow_dispatch:

concurrency:
  group: blender-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_SMOKE_ENGINE: BLENDER_EEVEE
      ANIMATION_RENDER_ENGINE: BLENDER_EEVEE
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node for procedural human character generation
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Blender and FFmpeg
        run: |
          bash scripts/install_blender.sh
      - name: Download verified CC0 mannequin asset for story fixtures
        run: |
          set -euo pipefail
          mkdir -p tests/fixtures/runtime-assets "$RUNNER_TEMP/kinemiq-assets"
          curl -fL --retry 3 -o "$RUNNER_TEMP/kinemiq-assets/animations.zip" https://github.com/Kinemiq/free-game-animations/releases/download/v1.0/KinemIQ_Free_Animations_CC0_FBX.zip
          echo "4ecea37e2117a762c8d2be10c7e0f06d9c7c9005af0f9caa64c8ce5d424efb0e  $RUNNER_TEMP/kinemiq-assets/animations.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kinemiq-assets/animations.zip" -d "$RUNNER_TEMP/kinemiq-assets/unpacked"
          MANNEQUIN="$(find "$RUNNER_TEMP/kinemiq-assets/unpacked" -type f -iname 'KinemIQ_Mannequin.fbx' -print -quit)"
          test -n "$MANNEQUIN"
          cp "$MANNEQUIN" tests/fixtures/runtime-assets/KinemIQ_Mannequin.fbx
          mkdir -p tests/fixtures/runtime-assets/animations
          cp "$RUNNER_TEMP/kinemiq-assets/unpacked/FBX/"*.fbx tests/fixtures/runtime-assets/animations/
          test -s tests/fixtures/runtime-assets/animations/Walk_forwards.fbx
          test -s tests/fixtures/runtime-assets/animations/Idle_relaxed.fbx
          echo "Installed $(find tests/fixtures/runtime-assets/animations -maxdepth 1 -type f -iname "*.fbx" | wc -l) CC0 animation clips"
      - name: Generate and validate Ara 3D human cast for story fixtures
        run: |
          set -euo pipefail
          mkdir -p tests/fixtures/runtime-assets/ara-cast
          npx --yes ara3d@0.9.0 export --random 1-6 --detail medium --animations walk,run,idle --formats glb --out tests/fixtures/runtime-assets/ara-cast
          mapfile -t CAST_MODELS < <(find tests/fixtures/runtime-assets/ara-cast -maxdepth 1 -type f -iname '*.glb' | sort)
          test "${#CAST_MODELS[@]}" -ge 6
          blender -b --python-exit-code 1 --python runtime/validate_character_assets.py -- --asset-dir "$GITHUB_WORKSPACE/tests/fixtures/runtime-assets/ara-cast" --min-assets 6
      - name: Test procedural terrain geometry inside Blender
        run: blender -b --python-exit-code 1 --python tests/blender/test_terrain.py
      - name: Test procedural humanoid character generation inside Blender
        run: blender -b --python-exit-code 1 --python tests/blender_character_smoke.py
      - name: Test explicit rig action retargeting inside Blender
        run: blender -b --python-exit-code 1 --python tests/blender/test_rig_retarget.py
      - name: Compile Python orchestration scripts
        run: |
          python3 -m py_compile runtime/animation_runtime.py runtime/render_story.py runtime/story_scene.py runtime/align_visemes.py runtime/asset_catalog.py runtime/rig_retarget.py runtime/environment_builder.py cloud/kaggle_gpu_render.py runtime/export_sheepit.py
      - name: Verify self-contained SheepIt export package
        run: |
          set -euo pipefail
          python3 runtime/export_sheepit.py --storyboard tests/fixtures/guddu_shop_market.json --output "$RUNNER_TEMP/sheepit-smoke.zip" --width 240 --height 426 --fps 12 --samples 8
          unzip -l "$RUNNER_TEMP/sheepit-smoke.zip" | grep -q 'shot.blend'
          unzip -l "$RUNNER_TEMP/sheepit-smoke.zip" | grep -q 'kaggle_gpu_render.py'
      - name: Validate Kaggle notebook Python cells
        run: |
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          notebook = json.loads(Path("cloud/kaggle_blender_renderer.ipynb").read_text(encoding="utf-8"))
          checked = 0
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              source = "\n".join(line for line in source.splitlines() if not line.lstrip().startswith("!"))
              if source.strip():
                  ast.parse(source, filename="kaggle-cell-%d" % index)
                  checked += 1
          assert checked >= 2, "Expected executable Kaggle renderer cells"
          print("Validated", checked, "Kaggle Python cells")
          PY
      - name: Validate reusable asset catalog
        run: |
          python3 runtime/asset_catalog.py validate
          python3 -m unittest tests.test_asset_catalog tests.test_align_visemes
      - name: Inspect installed tools
        run: |
          python3 runtime/animation_runtime.py inspect
      - name: Render animated Blender smoke test
        run: |
          python3 runtime/animation_runtime.py smoke-test --workdir "$RUNNER_TEMP/blender-smoke" --width 240 --height 426 --fps 12 --frames 24
      - name: Render three structurally different stories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/story-fixtures"
          # Keep CI bounded and representative: render three distinct genres, not every fixture.
          for storyboard in \
            tests/fixtures/guddu_shop_market.json \
            tests/fixtures/realistic_mountain_story.json \
            tests/fixtures/abstract_gravity_story.json; do
            name="$(basename "$storyboard" .json)"
            echo "CROSS_GENRE_RENDER_START story=$name"
            python3 runtime/render_story.py --storyboard "$storyboard" --output "$RUNNER_TEMP/story-fixtures/$name.mp4" --format shorts --width 240 --height 426 --fps 12 --samples 8 --retries 1 --stall-timeout-seconds 600 --progress-file "$RUNNER_TEMP/story-fixtures/$name-progress.json"
            test -s "$RUNNER_TEMP/story-fixtures/$name.mp4"
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json "$RUNNER_TEMP/story-fixtures/$name.mp4"
            echo "CROSS_GENRE_RENDER_DONE story=$name"
          done
          # Validate audio mux and subtitle burn-in without launching a fourth expensive Blender scene.
          ffmpeg -y -f lavfi -i "color=c=black:s=240x426:r=12:d=2" -f lavfi -i "sine=frequency=440:duration=2" -vf "drawtext=text='Audio pipeline test':fontcolor=white:fontsize=16:x=(w-text_w)/2:y=h-40" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$RUNNER_TEMP/story-fixtures/audio-mux-test.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of json "$RUNNER_TEMP/story-fixtures/audio-mux-test.mp4" | grep -q aac
      - name: Upload Blender smoke and cross-genre render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-cross-genre-smoke-renders
          path: |
            ${{ runner.temp }}/blender-smoke/
            ${{ runner.temp }}/story-fixtures/
            ${{ github.workspace }}/tests/fixtures/runtime-assets/ara-cast/
          if-no-files-found: warn
          retention-days: 7
