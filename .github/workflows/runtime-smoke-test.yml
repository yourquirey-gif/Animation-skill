name: Blender Python Runtime Smoke Test

on:
  push:
    paths:
      - "runtime/**"
      - "templates/**"
      - "tests/**"
      - "assets/**"
      - ".github/workflows/runtime-smoke-test.yml"
  workflow_dispatch:

concurrency:
  group: blender-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_SMOKE_ENGINE: BLENDER_EEVEE
      ANIMATION_RENDER_ENGINE: BLENDER_EEVEE
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri
      - name: Test procedural terrain geometry inside Blender
        run: blender -b --python-exit-code 1 --python tests/blender/test_terrain.py
      - name: Test procedural humanoid character generation inside Blender
        run: blender -b --python-exit-code 1 --python tests/blender_character_smoke.py
      - name: Compile Python orchestration scripts
        run: |
          python3 -m py_compile runtime/animation_runtime.py runtime/render_story.py runtime/story_scene.py runtime/align_visemes.py runtime/asset_catalog.py
      - name: Validate reusable asset catalog
        run: |
          python3 runtime/asset_catalog.py validate
          python3 -m unittest tests.test_asset_catalog tests.test_align_visemes
      - name: Inspect installed tools
        run: |
          python3 runtime/animation_runtime.py inspect
      - name: Render animated Blender smoke test
        run: |
          python3 runtime/animation_runtime.py smoke-test --workdir "$RUNNER_TEMP/blender-smoke" --width 240 --height 426 --fps 12 --frames 24
      - name: Render three structurally different stories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/story-fixtures"
          for storyboard in tests/fixtures/*.json; do
            name="$(basename "$storyboard" .json)"
            python3 runtime/render_story.py --storyboard "$storyboard" --output "$RUNNER_TEMP/story-fixtures/$name.mp4" --format shorts --width 240 --height 426 --fps 12 --samples 8 --retries 1 --progress-file "$RUNNER_TEMP/story-fixtures/$name-progress.json"
            test -s "$RUNNER_TEMP/story-fixtures/$name.mp4"
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json "$RUNNER_TEMP/story-fixtures/$name.mp4"
          done
          # Exercise actual audio mux and subtitle burn-in with a deterministic 2s test tone.
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=2" -c:a pcm_s16le "$RUNNER_TEMP/story-fixtures/test-tone.wav"
          printf "1\\n00:00:00,000 --> 00:00:01,900\\nAudio pipeline test\\n" > "$RUNNER_TEMP/story-fixtures/test-captions.srt"
          python3 runtime/render_story.py --storyboard tests/fixtures/human_prop_story.json --output "$RUNNER_TEMP/story-fixtures/audio-mux-test.mp4" --format shorts --width 240 --height 426 --fps 12 --samples 8 --voice "$RUNNER_TEMP/story-fixtures/test-tone.wav" --captions "$RUNNER_TEMP/story-fixtures/test-captions.srt" --retries 1 --progress-file "$RUNNER_TEMP/story-fixtures/audio-mux-progress.json"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of json "$RUNNER_TEMP/story-fixtures/audio-mux-test.mp4" | grep -q aac
      - name: Upload Blender smoke and cross-genre render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-cross-genre-smoke-renders
          path: |
            ${{ runner.temp }}/blender-smoke/
            ${{ runner.temp }}/story-fixtures/
          if-no-files-found: warn
          retention-days: 7
